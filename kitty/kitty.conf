# vim:ft=kitty

# Generated with Matugen

# The basic colors
#foreground              #e6e1e9
foreground              #cbc3dc
background              #141218
selection_foreground    #141218
selection_background    #cebdfe
background_opacity      0.95

# Cursor colors
cursor                  #cebdfe
cursor_text_color       #141218

# Scrollbar colors
scrollbar_handle_color  #948f99
scrollbar_track_color   #211f24

# URL color when hovering with mouse
url_color               #cebdfe

# Kitty window border colors
active_border_color     #cebdfe
inactive_border_color   #49454e
bell_border_color       #ffb4ab

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #35275d
active_tab_background   #cebdfe
inactive_tab_foreground #e6e1e9
inactive_tab_background #211f24
tab_bar_background      #0f0d13

# Colors for marks (marked text in the terminal)
mark1_foreground #141218
mark1_background #cebdfe
mark2_foreground #141218
mark2_background #cbc3dc
mark3_foreground #141218
mark3_background #efb8c8

# The 16 terminal colors

# black
color0 #0f0d13
color8 #49454e

# red
color1 #ffb4ab
color9 #ffb4ab

# green
color2  #cebdfe
color10 #cebdfe

# yellow
color3  #efb8c8
color11 #efb8c8

# blue
color4  #cbc3dc
color12 #cbc3dc

# magenta
color5  #64558f
color13 #64558f

# cyan
color6  #cebdfe
color14 #cebdfe

# white
color7  #e6e1e9
color15 #e6e1e9

# Force Kitty to make symbols scale up dynamically
symbol_map U+E000-U+EFFF,U+F000-U+FFFF,U+F0000-U+FFFFF   JetBrainsMono Nerd Font

# Adjust cell width/height slightly to give icons breathing room (Optional)
adjust_line_height  110%
adjust_column_width 100%
