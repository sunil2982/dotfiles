# vim:ft=kitty

# Generated with Matugen

# The basic colors
#foreground              #e2e2e9
foreground              #a9c7ff
background              #111318
selection_foreground    #111318
selection_background    #a9c7ff
background_opacity      0.95

# Cursor colors
cursor                  #a9c7ff
cursor_text_color       #111318

# Scrollbar colors
scrollbar_handle_color  #8e9099
scrollbar_track_color   #1d2024

# URL color when hovering with mouse
url_color               #a9c7ff

# Kitty window border colors
active_border_color     #a9c7ff
inactive_border_color   #44474e
bell_border_color       #ffb4ab

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #08305f
active_tab_background   #a9c7ff
inactive_tab_foreground #e2e2e9
inactive_tab_background #1d2024
tab_bar_background      #0c0e13

# Colors for marks (marked text in the terminal)
mark1_foreground #111318
mark1_background #a9c7ff
mark2_foreground #111318
mark2_background #bdc7dc
mark3_foreground #111318
mark3_background #dcbce1

# The 16 terminal colors

# black
color0 #0c0e13
color8 #44474e

# red
color1 #ffb4ab
color9 #ffb4ab

# green
color2  #a9c7ff
color10 #a9c7ff

# yellow
color3  #dcbce1
color11 #dcbce1

# blue
color4  #bdc7dc
color12 #bdc7dc

# magenta
color5  #405f90
color13 #405f90

# cyan
color6  #a9c7ff
color14 #a9c7ff

# white
color7  #e2e2e9
color15 #e2e2e9

# Force Kitty to make symbols scale up dynamically
symbol_map U+E000-U+EFFF,U+F000-U+FFFF,U+F0000-U+FFFFF   JetBrainsMono Nerd Font

# Adjust cell width/height slightly to give icons breathing room (Optional)
adjust_line_height  110%
adjust_column_width 100%
