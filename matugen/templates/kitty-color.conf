# vim:ft=kitty

# Generated with Matugen

# The basic colors
#foreground              {{colors.on_background.default.hex}}
foreground              {{colors.secondary.default.hex}}
background              {{colors.background.default.hex}}
selection_foreground    {{colors.background.default.hex}}
selection_background    {{colors.primary.default.hex}}
background_opacity      0.95

# Cursor colors
cursor                  {{colors.primary.default.hex}}
cursor_text_color       {{colors.background.default.hex}}

# Scrollbar colors
scrollbar_handle_color  {{colors.outline.default.hex}}
scrollbar_track_color   {{colors.surface_container.default.hex}}

# URL color when hovering with mouse
url_color               {{colors.primary.default.hex}}

# Kitty window border colors
active_border_color     {{colors.primary.default.hex}}
inactive_border_color   {{colors.surface_variant.default.hex}}
bell_border_color       {{colors.error.default.hex}}

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   {{colors.on_primary.default.hex}}
active_tab_background   {{colors.primary.default.hex}}
inactive_tab_foreground {{colors.on_surface.default.hex}}
inactive_tab_background {{colors.surface_container.default.hex}}
tab_bar_background      {{colors.surface_container_lowest.default.hex}}

# Colors for marks (marked text in the terminal)
mark1_foreground {{colors.background.default.hex}}
mark1_background {{colors.primary.default.hex}}
mark2_foreground {{colors.background.default.hex}}
mark2_background {{colors.secondary.default.hex}}
mark3_foreground {{colors.background.default.hex}}
mark3_background {{colors.tertiary.default.hex}}

# The 16 terminal colors

# black
color0 {{colors.surface_container_lowest.default.hex}}
color8 {{colors.surface_variant.default.hex}}

# red
color1 {{colors.error.default.hex}}
color9 {{colors.error.default.hex}}

# green
color2  {{colors.primary.default.hex}}
color10 {{colors.primary.default.hex}}

# yellow
color3  {{colors.tertiary.default.hex}}
color11 {{colors.tertiary.default.hex}}

# blue
color4  {{colors.secondary.default.hex}}
color12 {{colors.secondary.default.hex}}

# magenta
color5  {{colors.inverse_primary.default.hex}}
color13 {{colors.inverse_primary.default.hex}}

# cyan
color6  {{colors.primary_fixed_dim.default.hex}}
color14 {{colors.primary_fixed_dim.default.hex}}

# white
color7  {{colors.on_background.default.hex}}
color15 {{colors.on_surface.default.hex}}

# Force Kitty to make symbols scale up dynamically
symbol_map U+E000-U+EFFF,U+F000-U+FFFF,U+F0000-U+FFFFF   JetBrainsMono Nerd Font

# Adjust cell width/height slightly to give icons breathing room (Optional)
adjust_line_height  110%
adjust_column_width 100%
