[config]
theme = "dark"
scheme = "tonal-spot"

#scheme-tonal-spot (default)  --->The Default & Most Balanced
# scheme-content  -->  True to Image
# scheme-expressive  --> Most Colorful & Vibrant
# scheme-fidelity   -->  True to Source Color
# scheme-fruit-salad   --> Playful & Multi-colored
#scheme-monochrome   -->  Minimalist / Desaturated
#scheme-neutral   -->  Subtle & Desaturated)
# scheme-rainbow  --> Colorful & Varied


#[config.wallpaper] this is old way it will change the wallpaper also with command """matugen image "path to image".jpg"""
#set = true
#command = "awww"
#arguments = ["img", "--transition-type", "center","--transition-step", "15","--transition-fps","60"]

wallpaper_command = ["awww", "img", "--transition-type", "outer", "{{ image }}"]


[templates.hyprland]
input_path = "/home/sunil/.config/matugen/templates/hyprland-colors.lua"
output_path = "/home/sunil/.config/hypr/colors.lua"
post_hook = "hyprctl reload"


[templates.waybar]
input_path = "/home/sunil/.config/matugen/templates/colors.css"
output_path = "/home/sunil/.config/waybar/colors.css"
post_hook = "pkill -SIGUSR2 waybar"

[templates.kitty]
input_path = "/home/sunil/.config/matugen/templates/kitty-color.conf"
output_path = "/home/sunil/.config/kitty/kitty.conf"
post_hook = 'kill -SIGUSR1 $(pgrep kitty)'
#post_hook = "kitty +kitten themes --reload-in=all Matugen"
# ...



[templates.rofi]
input_path = "/home/sunil/.config/matugen/templates/rofi-colors.rasi"
output_path = "/home/sunil/.config/rofi/velvet.rasi"



[templates.swaync]
input_path = "/home/sunil/.config/matugen/templates/colors.css"
output_path = "/home/sunil/.config/swaync/colors.css"
post_hook = "swaync-client -rs 2>/dev/null || true"



[templates.starship]
