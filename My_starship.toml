# Tell Starship to use the custom matugen palette defined at the bottom of the file
palette = "colors"

format = """
 $os \
[❯](fg:color1)\
$username[❯](fg:color1)\
$directory[❯](fg:color1)\
$git_branch\
$git_status\
$fill\
$status\
$cmd_duration\
[❮](fg:color1)\
$time\
[ ](fg:color1)
 $character"""

# Disable the blank line at the start of the prompt
add_newline = false

[username]
show_always = true
style_user = "fg:color8"
style_root = "fg:color9"
format = '[$user]($style)'
disabled = false

[status]
style = ''
symbol = '[✘ ](fg:color9)'
success_symbol = '[✔ ](fg:color8)'
format = '[[$signal_name ](fg:color9)$symbol]($style)'
map_symbol = false
disabled = false

[character]
success_symbol = '[❯](fg:color9 bold)'
error_symbol = '[❯](fg:color9)'
vicmd_symbol = '[❯](fg:color1)'
disabled = false

[cmd_duration]
min_time = 1
style = 'fg:color1'
format = '[[$duration](bold fg:color8)  ]($style)'

[hostname]
ssh_only = false
style = 'fg:color3'
format = '[@$hostname ]($style)'
disabled = false

[os]
style = "fg:color1"
disabled = false

[directory]
style = "fg:color1"
format = "[$path]($style)"
truncation_length = 9
truncation_symbol = "…/"
truncate_to_repo = false
home_symbol = "~"
use_os_path_sep = true

[directory.substitutions]
"~" = " "
"Documents" = "   "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[fill]
symbol = ' '

[c]
symbol = ""
style = ""
format = '[ $symbol ]($style)'

[docker_context]
symbol = " "
style = ""
format = '[ $symbol $context ]($style) $path'

[git_branch]
style = "fg:color8"
format = '[❯](fg:color4)[  ](fg:color8)[ $branch ](bold $style)'

[git_status]
style = "fg:color1"
conflicted = "~"
up_to_date = " "
untracked = "?"
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
stashed = "*"
modified = " "
staged = '[++\($count\)](fg:color8)'
renamed = " "
deleted = " "
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = "go"
style = "fg:#FFFFFF" 
format = '[ $symbol ](bold $style)'

[java]
symbol = ""
style = "fg:color1"
format = '[ $symbol ]($style)'

[nodejs]
symbol = ""
style = "fg:color1"
format = '[ $symbol ]($style)'

[python]
symbol = ' '
style = "fg:color1"
format = '[ $symbol ]($style)'

[rust]
symbol = ""
style = "fg:color1"
format = '[ $symbol ]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:color8"
format = '[$time ]($style)'

[os.symbols]
AlmaLinux = ""
Amazon = ""
Arch = ""
Debian = ""
Kali = ""
Linux = ""
Macos = ""
Manjaro = ""
openSUSE = ""
Pop = ""
Raspbian = ""
Redhat = ""
RedHatEnterprise = ""
Solus = "  "
SUSE = ""
Ubuntu = ""
Windows = "  "

##### Matugen color mappings appended at the bottom
[palettes.colors]
color1 = "{{colors.primary.dark.hex}}"
color2  = "{{colors.secondary.dark.hex}}"
color3  = "{{colors.surface_container.dark.hex}}"
color4 = "{{colors.surface_container_high.dark.hex}}"
color5 = "{{colors.surface_container_low.dark.hex}}"
color6    = "{{colors.surface.dark.hex}}"
color7   = "{{colors.on_surface.dark.hex}}"
color8  = "{{colors.secondary.dark.hex}}"
color9   = "{{colors.error.dark.hex}}"