# vim:ft=kitty

# Generated with Matugen

# The basic colors
foreground              #e0e3e8
background              #101417
selection_foreground    #101417
selection_background    #97ccf8
background_opacity      0.85

# Cursor colors
cursor                  #97ccf8
cursor_text_color       #101417

# Scrollbar colors
scrollbar_handle_color  #8b9198
scrollbar_track_color   #1c2024

# URL color when hovering with mouse
url_color               #97ccf8

# Kitty window border colors
active_border_color     #97ccf8
inactive_border_color   #41474d
bell_border_color       #ffb4ab

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #00344f
active_tab_background   #97ccf8
inactive_tab_foreground #e0e3e8
inactive_tab_background #1c2024
tab_bar_background      #0b0f12

# Colors for marks (marked text in the terminal)
mark1_foreground #101417
mark1_background #97ccf8
mark2_foreground #101417
mark2_background #b8c8d9
mark3_foreground #101417
mark3_background #d0c0e8

# The 16 terminal colors

# black
color0 #0b0f12
color8 #41474d

# red
color1 #ffb4ab
color9 #ffb4ab

# green
color2  #97ccf8
color10 #97ccf8

# yellow
color3  #d0c0e8
color11 #d0c0e8

# blue
color4  #b8c8d9
color12 #b8c8d9

# magenta
color5  #29638a
color13 #29638a

# cyan
color6  #97ccf8
color14 #97ccf8

# white
color7  #e0e3e8
color15 #e0e3e8

# Force Kitty to make symbols scale up dynamically
symbol_map U+E000-U+EFFF,U+F000-U+FFFF,U+F0000-U+FFFFF   JetBrainsMono Nerd Font

# Adjust cell width/height slightly to give icons breathing room (Optional)
adjust_line_height  110%
adjust_column_width 100%