# vim:ft=kitty

# Generated with Matugen

# The basic colors
#foreground              #e4e1e9
foreground              #9491f8
background              #131318
selection_foreground    #131318
selection_background    #bfc2ff
background_opacity      0.95

# Cursor colors
cursor                  #bfc2ff
cursor_text_color       #131318

# Scrollbar colors
scrollbar_handle_color  #918f9a
scrollbar_track_color   #1f1f25

# URL color when hovering with mouse
url_color               #bfc2ff

# Kitty window border colors
active_border_color     #bfc2ff
inactive_border_color   #46464f
bell_border_color       #ffb4ab

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #272b60
active_tab_background   #bfc2ff
inactive_tab_foreground #e4e1e9
inactive_tab_background #1f1f25
tab_bar_background      #0e0e13

# Colors for marks (marked text in the terminal)
mark1_foreground #131318
mark1_background #bfc2ff
mark2_foreground #131318
mark2_background #c5c4dd
mark3_foreground #131318
mark3_background #e8b9d4

# The 16 terminal colors

# black
color0 #0e0e13
color8 #46464f

# red
color1 #ffb4ab
color9 #ffb4ab

# green
color2  #bfc2ff
color10 #bfc2ff

# yellow
color3  #e8b9d4
color11 #e8b9d4

# blue
color4  #c5c4dd
color12 #c5c4dd

# magenta
color5  #565992
color13 #565992

# cyan
color6  #bfc2ff
color14 #bfc2ff

# white
color7  #e4e1e9
color15 #e4e1e9

# Force Kitty to make symbols scale up dynamically
symbol_map U+E000-U+EFFF,U+F000-U+FFFF,U+F0000-U+FFFFF   JetBrainsMono Nerd Font

# Adjust cell width/height slightly to give icons breathing room (Optional)
adjust_line_height  110%
adjust_column_width 100%
