# vim:ft=kitty

# Generated with Matugen

# The basic colors
foreground              #dee3e5
background              #0f1416
selection_foreground    #0f1416
selection_background    #84d2e6
background_opacity      0.96

# Cursor colors
cursor                  #84d2e6
cursor_text_color       #0f1416

# Scrollbar colors
scrollbar_handle_color  #899295
scrollbar_track_color   #1b2022

# URL color when hovering with mouse
url_color               #84d2e6

# Kitty window border colors
active_border_color     #84d2e6
inactive_border_color   #3f484b
bell_border_color       #ffb4ab

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #003640
active_tab_background   #84d2e6
inactive_tab_foreground #dee3e5
inactive_tab_background #1b2022
tab_bar_background      #090f11

# Colors for marks (marked text in the terminal)
mark1_foreground #0f1416
mark1_background #84d2e6
mark2_foreground #0f1416
mark2_background #b2cbd2
mark3_foreground #0f1416
mark3_background #bfc4eb

# The 16 terminal colors

# black
color0 #090f11
color8 #3f484b

# red
color1 #ffb4ab
color9 #ffb4ab

# green
color2  #84d2e6
color10 #84d2e6

# yellow
color3  #bfc4eb
color11 #bfc4eb

# blue
color4  #b2cbd2
color12 #b2cbd2

# magenta
color5  #00687a
color13 #00687a

# cyan
color6  #84d2e6
color14 #84d2e6

# white
color7  #dee3e5
color15 #dee3e5

# Force Kitty to make symbols scale up dynamically
symbol_map U+E000-U+EFFF,U+F000-U+FFFF,U+F0000-U+FFFFF   JetBrainsMono Nerd Font

# Adjust cell width/height slightly to give icons breathing room (Optional)
adjust_line_height  110%
adjust_column_width 100%
